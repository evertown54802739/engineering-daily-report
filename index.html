<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>工程日報填報</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
      :root {
        --bg: #f4f7fb;
        --text: #172033;
        --muted: #6b7280;
        --primary: #1f4e79;
        --primary-dark: #173b5c;
        --primary-soft: #e7f0fa;
        --danger: #b42318;
        --danger-soft: #fee4e2;
        --success: #027a48;
        --success-soft: #ecfdf3;
        --line: #dbe4ef;
        --shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
        --radius-lg: 18px;
        --radius-md: 12px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        color: var(--text);
        background:
          linear-gradient(180deg, #eaf1f9 0%, #f4f7fb 280px), var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        line-height: 1.6;
      }

      .app-shell {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px max(40px, env(safe-area-inset-bottom));
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }

      .app-header {
        margin-bottom: 18px;
        padding: 22px 18px;
        border-radius: 24px;
        color: #fff;
        background: linear-gradient(
          135deg,
          #173b5c 0%,
          #1f4e79 55%,
          #2f6f9f 100%
        );
        box-shadow: var(--shadow);
      }

      .app-kicker {
        display: inline-flex;
        margin-bottom: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.14);
        font-size: 13px;
        font-weight: 600;
      }

      .app-title {
        margin: 0;
        font-size: 26px;
        line-height: 1.25;
        letter-spacing: 0.03em;
      }

      .app-subtitle {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 14px;
      }

      .section,
      .work-block {
        margin-bottom: 18px;
        padding: 18px;
        border: 1px solid rgba(217, 225, 236, 0.95);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
      }

      .section-header,
      .work-block-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .section-title,
      .work-block-title {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .section-desc,
      .work-block-desc {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .block-title-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .field,
      .field-full {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-full {
        grid-column: 1 / -1;
      }

      label {
        color: #26364d;
        font-size: 14px;
        font-weight: 700;
      }

      input,
      textarea,
      select {
        width: 100%;
        min-height: 46px;
        padding: 11px 12px;
        border: 1px solid #cfd8e6;
        border-radius: var(--radius-md);
        outline: none;
        appearance: none;
        -webkit-appearance: none;
        background: #fff;
        color: var(--text);
        font-size: 16px;
        line-height: 1.4;
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      select {
        padding-right: 38px;
        background-image:
          linear-gradient(45deg, transparent 50%, #6b7280 50%),
          linear-gradient(135deg, #6b7280 50%, transparent 50%);
        background-position:
          calc(100% - 18px) 50%,
          calc(100% - 12px) 50%;
        background-size:
          6px 6px,
          6px 6px;
        background-repeat: no-repeat;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(31, 78, 121, 0.12);
      }

      input::placeholder,
      textarea::placeholder {
        color: #9aa4b2;
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 0;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          opacity 0.12s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      .btn-primary {
        width: 100%;
        min-height: 52px;
        color: #fff;
        background: var(--primary);
        box-shadow: 0 10px 22px rgba(31, 78, 121, 0.22);
      }

      .btn-primary:hover {
        background: var(--primary-dark);
      }

      .btn-secondary {
        color: var(--primary);
        background: var(--primary-soft);
      }

      .btn-secondary:hover {
        background: #d9e9f7;
      }

      .btn-danger-soft {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .submit-disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .work-blocks,
      .dynamic-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .workers-list {
        margin-top: 14px;
      }

      .worker-row,
      .expense-row {
        display: grid;
        gap: 8px;
        align-items: end;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fbfdff;
      }

      .worker-row {
        grid-template-columns: 1.25fr 0.55fr 1fr 38px;
      }

      .expense-row {
        grid-template-columns: 1.4fr 0.7fr 38px;
      }

      .worker-row .field,
      .expense-row .field {
        gap: 4px;
      }

      .worker-row label,
      .expense-row label {
        font-size: 12px;
      }

      .worker-row input,
      .worker-row select,
      .expense-row input,
      .expense-row select {
        min-height: 40px;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 15px;
      }

      .remove-btn {
        width: 38px;
        min-width: 38px;
        height: 38px;
        min-height: 38px;
        padding: 0;
        border-radius: 50%;
        color: #64748b;
        background: #f1f5f9;
        font-size: 18px;
        line-height: 38px;
      }

      .remove-btn:hover {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .block-action-row {
        align-items: center;
        justify-content: space-between;
      }

      .remove-block-btn {
        margin-left: auto;
      }

      .result-box {
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        color: #334155;
        font-size: 14px;
        font-weight: 700;
        white-space: pre-line;
        box-shadow: 0 4px 14px rgba(23, 32, 51, 0.05);
      }

      .result-box.is-loading {
        color: var(--muted);
      }

      .result-box.is-success {
        border-color: #a6f4c5;
        background: var(--success-soft);
        color: var(--success);
      }

      .result-box.is-error {
        border-color: #fecdca;
        background: var(--danger-soft);
        color: var(--danger);
      }

      @media (max-width: 640px) {
  .worker-row {
    grid-template-columns: minmax(0, 1.45fr) 64px minmax(0, 1fr) 38px;
    gap: 6px;
    align-items: end;
  }

  .worker-row .field {
    min-width: 0;
  }

  .worker-row label {
    font-size: 12px;
  }

  .worker-row input,
  .worker-row select {
    min-height: 38px;
    padding: 7px 8px;
    font-size: 14px;
  }

  .worker-row .remove-btn {
    width: 36px;
    min-width: 36px;
    height: 36px;
    min-height: 36px;
    line-height: 36px;
  }
}
    </style>
  </head>

  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1 class="app-title">工程日報填報</h1>
        <p class="app-subtitle">填寫每日施工進度、人員、材料支出、當日結餘</p>
      </header>

      <section class="section">
        <div class="field-grid">
          <div class="field">
            <label for="reporterName">填報人</label>
            <input
              id="reporterName"
              type="text"
              placeholder="系統自動帶入 LINE 名稱"
            />
          </div>

          <div class="field">
            <label for="workDate">日期</label>
            <input id="workDate" type="date" />
          </div>

          <div class="field-full">
            <label for="balanceText">當日結餘</label>
            <input
              id="balanceText"
              type="text"
              placeholder="例如：負12000+4000=負8000"
            />
          </div>

          <div class="field-full">
            <label for="remark">備註</label>
            <textarea
              id="remark"
              rows="3"
              placeholder="可填寫當日施工狀況、特殊事項或補充說明"
            ></textarea>
          </div>
        </div>
      </section>

      <section class="section">
        <div id="workBlocksContainer" class="work-blocks"></div>

        <div class="action-row">
          <button id="addWorkBlockBtn" type="button" class="btn-secondary">
            ＋ 新增區塊
          </button>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <div>
            <h2 class="section-title">購買材料 / 支出明細</h2>
            <p class="section-desc">沒有支出可不用新增</p>
          </div>
        </div>

        <div id="expensesContainer" class="dynamic-list"></div>

        <div class="action-row">
          <button id="addExpenseBtn" type="button" class="btn-secondary">
            ＋ 新增材料 / 支出
          </button>
        </div>
      </section>

      <button id="submitBtn" type="button" class="btn-primary">
        送出工程日報
      </button>
      <div id="result" class="result-box is-loading">正在載入頁面...</div>
    </main>

    <script>
      const CONFIG = {
        appsScriptUrl:
          "https://script.google.com/macros/s/AKfycbzhpmWAZ9IYYZEEAKD2cYRves3wzHfdt7ctOxOFqtbwX7DUkifG8AnI7KQgA6IsBvqD/exec",
        liffId: "2010143172-JoeL4pE7",
        defaultWorkerRowsPerBlock: 5,
      };

      const state = {
        employeeNames: [],
        blockSeq: 0,
        expenseSeq: 0,
        isSubmitting: false,
        lineProfile: null,
        lineUserId: "",
        lineIdToken: "",
      };

      const dom = {};

      document.addEventListener("DOMContentLoaded", initializeApp);

      async function initializeApp() {
        cacheDom();
        bindEvents();

        try {
          setResult("正在初始化 LIFF...", "loading");
          await initializeLiff();

          setResult("正在讀取員工名單...", "loading");
          loadEmployeeNames();
        } catch (error) {
          setResult("頁面初始化失敗：" + getErrorMessage(error), "error");
        }
      }

      function cacheDom() {
        [
          "reporterName",
          "workDate",
          "balanceText",
          "remark",
          "workBlocksContainer",
          "expensesContainer",
          "addWorkBlockBtn",
          "addExpenseBtn",
          "submitBtn",
          "result",
        ].forEach((id) => {
          dom[id] = document.getElementById(id);
        });
      }

      function bindEvents() {
        dom.addWorkBlockBtn.addEventListener("click", () => addWorkBlock());
        dom.addExpenseBtn.addEventListener("click", addExpenseRow);
        dom.submitBtn.addEventListener("click", submitForm);
      }

      function setTodayIfEmpty() {
        if (dom.workDate.value) return;

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");

        dom.workDate.value = `${yyyy}-${mm}-${dd}`;
      }

      async function initializeLiff() {
        if (typeof liff === "undefined") {
          throw new Error("找不到 LIFF SDK，請確認網路連線或 SDK 載入狀態");
        }

        await liff.init({
          liffId: CONFIG.liffId,
          withLoginOnExternalBrowser: false,
        });

        if (!liff.isInClient()) {
          clearLineProfile();
          return;
        }

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        state.lineProfile = await liff.getProfile();
        state.lineUserId = state.lineProfile.userId || "";
        state.lineIdToken = liff.getIDToken() || "";

        if (!dom.reporterName.value) {
          dom.reporterName.value = state.lineProfile.displayName || "";
        }
      }

      function clearLineProfile() {
        state.lineProfile = null;
        state.lineUserId = "";
        state.lineIdToken = "";
      }

      function validateApiUrl() {
        if (!CONFIG.appsScriptUrl || CONFIG.appsScriptUrl.includes("請貼上")) {
          throw new Error("尚未設定 Apps Script /exec 網址");
        }
      }

      function loadEmployeeNames() {
        try {
          validateApiUrl();
        } catch (error) {
          setResult(getErrorMessage(error), "error");
          return;
        }

        setResult("正在讀取員工名單...", "loading");

        const callbackName = `handleEmployees_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        const script = document.createElement("script");

        window[callbackName] = (response) => {
          try {
            if (!response?.success) {
              throw new Error(response?.message || "讀取員工名單失敗");
            }

            state.employeeNames = Array.isArray(response.names)
              ? response.names
              : [];
            resetFormRows();

            setResult(
              state.employeeNames.length > 0
                ? `員工名單載入成功，共 ${state.employeeNames.length} 人`
                : "員工名單載入成功，但 Employees 表目前沒有資料",
              "success",
            );
          } catch (error) {
            setResult("載入員工名單失敗：" + getErrorMessage(error), "error");
          } finally {
            cleanupJsonp(callbackName, script);
          }
        };

        script.onerror = () => {
          setResult("載入員工名單失敗：無法連線到 Apps Script", "error");
          cleanupJsonp(callbackName, script);
        };

        script.src = `${CONFIG.appsScriptUrl}?action=employees&callback=${encodeURIComponent(callbackName)}&t=${Date.now()}`;
        document.body.appendChild(script);
      }

      function cleanupJsonp(callbackName, script) {
        delete window[callbackName];
        script.parentNode?.removeChild(script);
      }

      function resetFormRows() {
        dom.workBlocksContainer.innerHTML = "";
        dom.expensesContainer.innerHTML = "";
        state.blockSeq = 0;
        state.expenseSeq = 0;
        addWorkBlock();
      }

      function addWorkBlock() {
        state.blockSeq += 1;

        const block = createElement("article", {
          className: "work-block",
          dataset: { blockIndex: state.blockSeq },
        });

        block.append(
          createWorkBlockTitleFields(state.blockSeq),
          createWorkersList(),
          createWorkBlockActions(block),
        );

        dom.workBlocksContainer.appendChild(block);

        for (let i = 0; i < CONFIG.defaultWorkerRowsPerBlock; i += 1) {
          addWorkerRow(block);
        }

        renumberWorkBlocks();
      }

      function createWorkBlockTitleFields(index) {
        const grid = createElement("div", { className: "block-title-grid" });

        grid.append(
          createField({
            label: "工程內容",
            control: createInput({
              type: "text",
              className: "block-project",
            }),
          }),
        );

        return grid;
      }

      function createWorkersList() {
        return createElement("div", { className: "dynamic-list workers-list" });
      }

      function createWorkBlockActions(block) {
        const actionRow = createElement("div", {
          className: "action-row block-action-row",
        });
        const addWorkerButton = createElement("button", {
          className: "btn-secondary",
          type: "button",
          textContent: "＋ 新增人員",
        });
        const removeBlockButton = createElement("button", {
          className: "btn-danger-soft remove-block-btn",
          type: "button",
          textContent: "刪除此區塊",
        });

        addWorkerButton.addEventListener("click", () => addWorkerRow(block));
        removeBlockButton.addEventListener("click", () =>
          removeWorkBlock(block),
        );

        actionRow.append(addWorkerButton, removeBlockButton);
        return actionRow;
      }

      function removeWorkBlock(block) {
        if (
          dom.workBlocksContainer.querySelectorAll(".work-block").length <= 1
        ) {
          setResult("至少要保留 1 個施工區塊", "error");
          return;
        }

        block.remove();
        renumberWorkBlocks();
        clearResult();
      }

      function addWorkerRow(block) {
        const workersList = block.querySelector(".workers-list");
        const row = createElement("div", {
          className: "worker-row",
          dataset: {
            workerIndex: workersList.querySelectorAll(".worker-row").length + 1,
          },
        });
        const removeButton = createElement("button", {
          className: "remove-btn",
          type: "button",
          textContent: "×",
          title: "刪除此人員",
        });

        removeButton.addEventListener("click", () =>
          removeWorkerRow(block, row),
        );

        row.append(
          createField({
            label: "人員",
            control: createWorkerSelect(),
          }),
          createField({
            label: "時數",
            control: createInput({
              type: "number",
              className: "worker-hours",
              value: "8",
              min: "0",
              step: "0.5",
              inputMode: "decimal",
            }),
          }),
          createField({
            label: "備註",
            control: createInput({
              type: "text",
              className: "worker-note",
            }),
          }),
          removeButton,
        );

        workersList.appendChild(row);
        renumberWorkers(block);
      }

      function removeWorkerRow(block, row) {
        const workersList = block.querySelector(".workers-list");

        if (workersList.querySelectorAll(".worker-row").length <= 1) {
          setResult("每個施工區塊至少要保留 1 個人員輸入列", "error");
          return;
        }

        row.remove();
        renumberWorkers(block);
        clearResult();
      }

      function renumberWorkBlocks() {
        const blocks = Array.from(
          dom.workBlocksContainer.querySelectorAll(".work-block"),
        );

        blocks.forEach((block, blockZeroIndex) => {
          const blockIndex = blockZeroIndex + 1;
          block.dataset.blockIndex = String(blockIndex);
          renumberWorkers(block);
        });

        state.blockSeq = blocks.length;
      }

      function renumberWorkers(block) {
        const blockIndex = block.dataset.blockIndex;
        const rows = Array.from(block.querySelectorAll(".worker-row"));

        rows.forEach((row, workerZeroIndex) => {
          const workerIndex = workerZeroIndex + 1;
          row.dataset.workerIndex = String(workerIndex);
          const label = row.querySelector("label");
          if (label) label.textContent = `人員 ${workerIndex}`;

          const select = row.querySelector("select");
          const hours = row.querySelector(".worker-hours");
          const note = row.querySelector(".worker-note");

          if (select)
            select.id = `block_${blockIndex}_worker_${workerIndex}_name`;
          if (hours)
            hours.id = `block_${blockIndex}_worker_${workerIndex}_hours`;
          if (note) note.id = `block_${blockIndex}_worker_${workerIndex}_note`;
        });
      }

      function addExpenseRow() {
        state.expenseSeq += 1;

        const index = state.expenseSeq;
        const row = createElement("div", {
          className: "expense-row",
          dataset: { expenseIndex: index },
        });
        const removeButton = createElement("button", {
          className: "remove-btn",
          type: "button",
          textContent: "×",
          title: "刪除此材料 / 支出",
        });

        removeButton.addEventListener("click", () => removeExpenseRow(row));

        row.append(
          createField({
            label: `項目 ${index}`,
            control: createInput({
              type: "text",
              className: "expense-item",
              placeholder: "電料、水泥、五金",
            }),
          }),
          createField({
            label: "金額",
            control: createInput({
              type: "number",
              className: "expense-amount",
              placeholder: "675",
              min: "0",
              inputMode: "numeric",
            }),
          }),
          removeButton,
        );

        dom.expensesContainer.appendChild(row);
        renumberExpenses();
      }

      function removeExpenseRow(row) {
        row.remove();
        renumberExpenses();
        clearResult();
      }

      function renumberExpenses() {
        const rows = Array.from(
          dom.expensesContainer.querySelectorAll(".expense-row"),
        );

        rows.forEach((row, zeroBasedIndex) => {
          const index = zeroBasedIndex + 1;
          row.dataset.expenseIndex = String(index);

          const label = row.querySelector("label");
          const item = row.querySelector(".expense-item");
          const amount = row.querySelector(".expense-amount");

          if (label) label.textContent = `項目 ${index}`;
          if (item) item.id = `expense_${index}_item`;
          if (amount) amount.id = `expense_${index}_amount`;
        });

        state.expenseSeq = rows.length;
      }

      function createWorkerSelect() {
        const select = createElement("select", { className: "worker-name" });

        select.appendChild(
          createElement("option", { value: "", textContent: "請選擇人員" }),
        );

        state.employeeNames.forEach((name) => {
          select.appendChild(
            createElement("option", { value: name, textContent: name }),
          );
        });

        return select;
      }

      function createField({ label, control, className = "field" }) {
        const wrapper = createElement("div", { className });
        const labelElement = createElement("label", { textContent: label });

        wrapper.append(labelElement, control);
        return wrapper;
      }

      function createInput(attributes) {
        return createElement("input", attributes);
      }

      function createElement(tagName, options = {}) {
        const element = document.createElement(tagName);

        Object.entries(options).forEach(([key, value]) => {
          if (key === "dataset") {
            Object.entries(value).forEach(([dataKey, dataValue]) => {
              element.dataset[dataKey] = dataValue;
            });
            return;
          }

          if (key in element) {
            element[key] = value;
          } else {
            element.setAttribute(key, value);
          }
        });

        return element;
      }

      function submitForm() {
        if (state.isSubmitting) {
          setResult("資料送出中，請勿重複點擊", "loading");
          return;
        }

        try {
          validateApiUrl();

          const data = buildReportPayload();
          const errorMessage = validateReportPayload(data);

          if (errorMessage) {
            setResult(errorMessage, "error");
            return;
          }

          sendReport(data);
        } catch (error) {
          setResult(getErrorMessage(error), "error");
        }
      }

      function buildReportPayload() {
        const workSections = collectWorkSections();
        const activeSections = getActiveWorkSections(workSections);
        const flattenedWorkers = flattenWorkers(activeSections);
        const projectName = buildProjectNameText(activeSections);

        return {
          submissionToken: generateSubmissionToken(),
          reporterName: getValue("reporterName"),
          reporterLineUserId: state.lineUserId,
          reporterIdToken: state.lineIdToken,
          workDate: getValue("workDate"),
          projectName,
          balanceText: getValue("balanceText"),
          remark: getValue("remark"),
          workers: flattenedWorkers,
          expenses: collectExpenses(),
          workSections: activeSections,
        };
      }

      function collectWorkSections() {
        return Array.from(
          dom.workBlocksContainer.querySelectorAll(".work-block"),
        ).map((block) => {
          const projectName =
            block.querySelector(".block-project")?.value || "";
          const workers = Array.from(block.querySelectorAll(".worker-row")).map(
            (row) => ({
              name: row.querySelector(".worker-name")?.value || "",
              hours: row.querySelector(".worker-hours")?.value || "",
              note: row.querySelector(".worker-note")?.value || "",
            }),
          );

          return {
            projectName: projectName.trim(),
            workers,
          };
        });
      }

      function getActiveWorkSections(workSections) {
        return workSections.filter((section) => {
          const hasProject = Boolean(String(section.projectName || "").trim());
          const hasWorker = section.workers.some((worker) =>
            String(worker.name || "").trim(),
          );

          return hasProject || hasWorker;
        });
      }

      function flattenWorkers(workSections) {
        return workSections.flatMap((section) => {
          const sectionLabel = String(section.projectName || "").trim();

          return section.workers
            .filter((worker) => String(worker.name || "").trim())
            .map((worker) => {
              const rawNote = String(worker.note || "").trim();
              const note = [
                sectionLabel ? `區塊：${sectionLabel}` : "",
                rawNote,
              ]
                .filter(Boolean)
                .join("；");

              return {
                name: worker.name,
                hours: worker.hours,
                note,
              };
            });
        });
      }

      function buildProjectNameText(workSections) {
        return workSections
          .map(
            (section, index) =>
              `${index + 1}. ${section.projectName || "未填工程內容"}`,
          )
          .join("；");
      }

      function collectExpenses() {
        return Array.from(
          dom.expensesContainer.querySelectorAll(".expense-row"),
        ).map((row) => ({
          item: row.querySelector(".expense-item")?.value || "",
          amount: row.querySelector(".expense-amount")?.value || "",
        }));
      }

      function validateReportPayload(data) {
        return (
          validateWorkDate(data.workDate) ||
          validateWorkSections(data.workSections) ||
          validateWorkers(data.workers) ||
          validateExpenses(data.expenses)
        );
      }

      function validateWorkDate(workDate) {
        return workDate ? "" : "工作日期不可空白";
      }

      function validateWorkSections(workSections) {
        const activeSections = getActiveWorkSections(workSections);

        if (activeSections.length === 0) {
          return "至少需要 1 個有資料的施工區塊";
        }

        const hasAnyWorker = activeSections.some((section) =>
          section.workers.some((worker) => String(worker.name || "").trim()),
        );

        if (!hasAnyWorker) {
          return "至少需要 1 位有效人員";
        }

        return "";
      }

      function validateWorkers(workers) {
        const usedNamesBySection = new Map();

        for (let i = 0; i < workers.length; i += 1) {
          const worker = workers[i];

          if (!worker.name) continue;

          if (
            worker.hours === "" ||
            worker.hours === null ||
            worker.hours === undefined
          ) {
            return `人員「${worker.name}」已選姓名，但未填工作時數`;
          }

          const hoursNumber = Number(worker.hours);
          if (Number.isNaN(hoursNumber) || hoursNumber <= 0) {
            return `人員「${worker.name}」的工作時數必須大於 0`;
          }
        }

        return "";
      }

      function validateExpenses(expenses) {
        for (let i = 0; i < expenses.length; i += 1) {
          const expense = expenses[i];
          const rowNo = i + 1;
          const item = String(expense.item || "").trim();
          const amountRaw = expense.amount;
          const hasItem = item !== "";
          const hasAmount =
            amountRaw !== "" && amountRaw !== null && amountRaw !== undefined;

          if (hasItem && !hasAmount) {
            return `支出第 ${rowNo} 筆已填項目，但未填金額`;
          }

          if (!hasItem && hasAmount) {
            return `支出第 ${rowNo} 筆已填金額，但未填項目`;
          }

          if (!hasItem && !hasAmount) continue;

          const amountNumber = Number(amountRaw);

          if (Number.isNaN(amountNumber)) {
            return `支出第 ${rowNo} 筆金額格式錯誤`;
          }

          if (amountNumber < 0) {
            return `支出第 ${rowNo} 筆金額不可小於 0`;
          }
        }

        return "";
      }

      function sendReport(data) {
        setSubmittingState(true);
        setResult("正在送出資料...", "loading");

        fetch(CONFIG.appsScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify(data),
        })
          .then(() => {
            setResult(
              "已送出資料。\n請到 Google Sheet 檢查是否新增資料。",
              "success",
            );
            closeLiffWindowIfNeeded();
          })
          .catch((error) => {
            setResult("送出失敗：" + getErrorMessage(error), "error");
          })
          .finally(() => {
            setSubmittingState(false);
          });
      }

      function closeLiffWindowIfNeeded() {
        if (typeof liff === "undefined" || !liff.isInClient?.()) return;

        setTimeout(() => {
          liff.closeWindow();
        }, 1200);
      }

      function setSubmittingState(isSubmitting) {
        state.isSubmitting = isSubmitting;
        dom.submitBtn.disabled = isSubmitting;
        dom.submitBtn.classList.toggle("submit-disabled", isSubmitting);
        dom.submitBtn.textContent = isSubmitting
          ? "送出中，請稍候..."
          : "送出工程日報";
      }

      function setResult(message, type = "loading") {
        dom.result.textContent = message;
        dom.result.className = `result-box is-${type}`;
      }

      function clearResult() {
        dom.result.textContent = "";
        dom.result.className = "result-box";
      }

      function getValue(id) {
        return document.getElementById(id)?.value || "";
      }

      function generateSubmissionToken() {
        return `SUB_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
      }

      function getErrorMessage(error) {
        return error?.message || String(error);
      }
    </script>
  </body>
</html>
