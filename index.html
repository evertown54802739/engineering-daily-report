<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>工程日報填報</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
      :root {
        --bg: #f4f7fb;
        --text: #172033;
        --muted: #6b7280;
        --primary: #1f4e79;
        --primary-dark: #173b5c;
        --primary-soft: #e7f0fa;
        --danger: #b42318;
        --danger-soft: #fee4e2;
        --success: #027a48;
        --success-soft: #ecfdf3;
        --shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
        --radius-lg: 18px;
        --radius-md: 12px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        color: var(--text);
        background: linear-gradient(180deg, #eaf1f9 0%, #f4f7fb 280px), var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        line-height: 1.6;
      }

      .app-shell {
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        padding: 20px 16px max(40px, env(safe-area-inset-bottom));
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }

      .app-header {
        margin-bottom: 18px;
        padding: 22px 18px;
        border-radius: 24px;
        color: #fff;
        background: linear-gradient(135deg, #173b5c 0%, #1f4e79 55%, #2f6f9f 100%);
        box-shadow: var(--shadow);
      }

      .app-kicker {
        display: inline-flex;
        align-items: center;
        margin-bottom: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.14);
        font-size: 13px;
        font-weight: 600;
      }

      .app-title {
        margin: 0;
        font-size: 26px;
        line-height: 1.25;
        letter-spacing: 0.03em;
      }

      .app-subtitle {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 14px;
      }

      .section {
        margin-bottom: 18px;
        padding: 18px;
        border: 1px solid rgba(217, 225, 236, 0.95);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
      }

      .section-header {
        margin-bottom: 16px;
      }

      .section-title {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .section-desc {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .field-grid,
      .row-grid {
        display: grid;
        gap: 14px;
      }

      .field-grid {
        grid-template-columns: 1fr 1fr;
      }

      .row-grid {
        grid-template-columns: 1.3fr 0.7fr;
      }

      .field,
      .field-full {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-full {
        grid-column: 1 / -1;
      }

      label {
        color: #26364d;
        font-size: 14px;
        font-weight: 700;
      }

      input,
      textarea,
      select {
        width: 100%;
        min-height: 46px;
        padding: 11px 12px;
        border: 1px solid #cfd8e6;
        border-radius: var(--radius-md);
        outline: none;
        appearance: none;
        -webkit-appearance: none;
        background: #fff;
        color: var(--text);
        font-size: 16px;
        line-height: 1.4;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      select {
        padding-right: 38px;
        background-image: linear-gradient(45deg, transparent 50%, #6b7280 50%), linear-gradient(135deg, #6b7280 50%, transparent 50%);
        background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
        background-size: 6px 6px, 6px 6px;
        background-repeat: no-repeat;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(31, 78, 121, 0.12);
      }

      input::placeholder,
      textarea::placeholder {
        color: #9aa4b2;
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 0;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      .btn-primary {
        width: 100%;
        min-height: 52px;
        color: #fff;
        background: var(--primary);
        box-shadow: 0 10px 22px rgba(31, 78, 121, 0.22);
      }

      .btn-primary:hover {
        background: var(--primary-dark);
      }

      .btn-secondary {
        color: var(--primary);
        background: var(--primary-soft);
      }

      .btn-secondary:hover {
        background: #d9e9f7;
      }

      .submit-disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .dynamic-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .entry-card {
        padding: 14px;
        border: 1px solid #dbe4ef;
        border-radius: 16px;
        background: #fbfdff;
      }

      .entry-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .entry-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: #1f2937;
        font-size: 15px;
        font-weight: 800;
      }

      .entry-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 28px;
        padding: 0 9px;
        border-radius: 999px;
        color: #fff;
        background: var(--primary);
        font-size: 13px;
        font-weight: 800;
      }

      .remove-btn {
        width: 38px;
        min-width: 38px;
        height: 38px;
        min-height: 38px;
        padding: 0;
        border-radius: 50%;
        color: #64748b;
        background: #f1f5f9;
        font-size: 18px;
        line-height: 38px;
      }

      .remove-btn:hover {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .action-row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .result-box {
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid #dbe4ef;
        border-radius: 14px;
        background: #fff;
        color: #334155;
        font-size: 14px;
        font-weight: 700;
        white-space: pre-line;
        box-shadow: 0 4px 14px rgba(23, 32, 51, 0.05);
      }

      .result-box.is-loading {
        color: var(--muted);
      }

      .result-box.is-success {
        border-color: #a6f4c5;
        background: var(--success-soft);
        color: var(--success);
      }

      .result-box.is-error {
        border-color: #fecdca;
        background: var(--danger-soft);
        color: var(--danger);
      }

      @media (max-width: 640px) {
        .app-shell {
          padding-top: 14px;
        }

        .app-header {
          padding: 20px 16px;
          border-radius: 22px;
        }

        .app-title {
          font-size: 24px;
        }

        .section {
          padding: 16px;
          border-radius: 18px;
        }

        .field-grid,
        .row-grid {
          grid-template-columns: 1fr;
        }

        .field-full {
          grid-column: auto;
        }

        .action-row {
          flex-direction: column;
        }

        .btn-secondary {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="app-kicker">工程日報系統</div>
        <h1 class="app-title">工程日報填報</h1>
        <p class="app-subtitle">填寫每日施工人員、地點、支出與備註資訊</p>
      </header>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">基本資料</h2>
          <p class="section-desc">請確認日期、工程名稱與填報人資料</p>
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="reporterName">填報人姓名</label>
            <input id="reporterName" type="text" placeholder="系統可自動帶入 LINE 名稱" />
          </div>

          <div class="field">
            <label for="workDate">日期</label>
            <input id="workDate" type="date" />
          </div>

          <div class="field-full">
            <label for="projectName">工程名稱</label>
            <input id="projectName" type="text" placeholder="請輸入工程名稱" />
          </div>

          <div class="field-full">
            <label for="site">地點</label>
            <input id="site" type="text" placeholder="請輸入施工地點" />
          </div>

          <div class="field-full">
            <label for="balanceText">結餘說明</label>
            <input id="balanceText" type="text" placeholder="例如：負14657+875=負15532" />
          </div>

          <div class="field-full">
            <label for="remark">備註</label>
            <textarea id="remark" rows="3" placeholder="可填寫當日施工狀況、特殊事項或補充說明"></textarea>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">人員名單</h2>
          <p class="section-desc">可新增多位施工人員，工時必填</p>
        </div>

        <div id="workersContainer" class="dynamic-list"></div>

        <div class="action-row">
          <button id="addWorkerBtn" type="button" class="btn-secondary">＋ 新增人員</button>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">購買材料 / 支出明細</h2>
          <p class="section-desc">請填寫購買項目與金額，項目與金額需成對填寫</p>
        </div>

        <div id="expensesContainer" class="dynamic-list"></div>

        <div class="action-row">
          <button id="addExpenseBtn" type="button" class="btn-secondary">＋ 新增材料 / 支出</button>
        </div>
      </section>

      <button id="submitBtn" type="button" class="btn-primary">送出工程日報</button>
      <div id="result" class="result-box is-loading">正在載入頁面...</div>
    </main>

    <script>
      const CONFIG = {
        appsScriptUrl: "https://script.google.com/macros/s/AKfycbxEGuG2AG0_Uw34614qtVqmToYuArF6GcdorMVLKNr6r1eerfIsY1oY41J7-e6qbWun/exec",
        liffId: "2010143172-JoeL4pE7",
      };

      const state = {
        employeeNames: [],
        workerSeq: 0,
        expenseSeq: 0,
        isSubmitting: false,
        lineProfile: null,
        lineUserId: "",
        lineIdToken: "",
      };

      const dom = {};

      document.addEventListener("DOMContentLoaded", initializeApp);

      async function initializeApp() {
        cacheDom();
        bindEvents();
        setTodayIfEmpty();

        try {
          setResult("正在初始化 LIFF...", "loading");
          await initializeLiff();

          setResult("正在讀取員工名單...", "loading");
          loadEmployeeNames();
        } catch (error) {
          setResult("頁面初始化失敗：" + getErrorMessage(error), "error");
        }
      }

      function cacheDom() {
        [
          "reporterName",
          "workDate",
          "projectName",
          "site",
          "balanceText",
          "remark",
          "workersContainer",
          "expensesContainer",
          "addWorkerBtn",
          "addExpenseBtn",
          "submitBtn",
          "result",
        ].forEach((id) => {
          dom[id] = document.getElementById(id);
        });
      }

      function bindEvents() {
        dom.addWorkerBtn.addEventListener("click", addWorkerRow);
        dom.addExpenseBtn.addEventListener("click", addExpenseRow);
        dom.submitBtn.addEventListener("click", submitForm);
      }

      function setTodayIfEmpty() {
        if (dom.workDate.value) return;

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");

        dom.workDate.value = `${yyyy}-${mm}-${dd}`;
      }

      async function initializeLiff() {
        if (typeof liff === "undefined") {
          throw new Error("找不到 LIFF SDK，請確認網路連線或 SDK 載入狀態");
        }

        await liff.init({
          liffId: CONFIG.liffId,
          withLoginOnExternalBrowser: false,
        });

        if (!liff.isInClient()) {
          clearLineProfile();
          return;
        }

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        state.lineProfile = await liff.getProfile();
        state.lineUserId = state.lineProfile.userId || "";
        state.lineIdToken = liff.getIDToken() || "";

        if (!dom.reporterName.value) {
          dom.reporterName.value = state.lineProfile.displayName || "";
        }
      }

      function clearLineProfile() {
        state.lineProfile = null;
        state.lineUserId = "";
        state.lineIdToken = "";
      }

      function validateApiUrl() {
        if (!CONFIG.appsScriptUrl || CONFIG.appsScriptUrl.includes("請貼上")) {
          throw new Error("尚未設定 Apps Script /exec 網址");
        }
      }

      function loadEmployeeNames() {
        try {
          validateApiUrl();
        } catch (error) {
          setResult(getErrorMessage(error), "error");
          return;
        }

        setResult("正在向 Apps Script 讀取員工名單...", "loading");

        const callbackName = `handleEmployees_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        const script = document.createElement("script");

        window[callbackName] = (response) => {
          try {
            if (!response?.success) {
              throw new Error(response?.message || "讀取員工名單失敗");
            }

            state.employeeNames = Array.isArray(response.names) ? response.names : [];
            resetDynamicRows();

            setResult(
              state.employeeNames.length > 0
                ? `員工名單載入成功，共 ${state.employeeNames.length} 人`
                : "員工名單載入成功，但 Employees 表目前沒有資料",
              "success",
            );
          } catch (error) {
            setResult("載入員工名單失敗：" + getErrorMessage(error), "error");
          } finally {
            cleanupJsonp(callbackName, script);
          }
        };

        script.onerror = () => {
          setResult("載入員工名單失敗：無法連線到 Apps Script", "error");
          cleanupJsonp(callbackName, script);
        };

        script.src = `${CONFIG.appsScriptUrl}?action=employees&callback=${encodeURIComponent(callbackName)}&t=${Date.now()}`;
        document.body.appendChild(script);
      }

      function cleanupJsonp(callbackName, script) {
        delete window[callbackName];
        script.parentNode?.removeChild(script);
      }

      function resetDynamicRows() {
        dom.workersContainer.innerHTML = "";
        dom.expensesContainer.innerHTML = "";
        state.workerSeq = 0;
        state.expenseSeq = 0;

        addWorkerRow();
        addExpenseRow();
      }

      function addWorkerRow() {
        state.workerSeq += 1;

        const index = state.workerSeq;
        const card = createEntryCard("worker", index, "人員資料");
        const grid = createElement("div", { className: "row-grid" });

        grid.append(
          createField({
            label: "人員姓名",
            control: createWorkerSelect(index),
          }),
          createField({
            label: "工作時數",
            control: createInput({
              id: `worker_hours_${index}`,
              type: "number",
              placeholder: "例如：8",
              min: "0",
              step: "0.5",
              inputMode: "decimal",
            }),
          }),
          createField({
            label: "人員備註",
            className: "field-full",
            control: createInput({
              id: `worker_note_${index}`,
              type: "text",
              placeholder: "例如：加班、半天、支援",
            }),
          }),
        );

        card.appendChild(grid);
        dom.workersContainer.appendChild(card);
      }

      function addExpenseRow() {
        state.expenseSeq += 1;

        const index = state.expenseSeq;
        const card = createEntryCard("expense", index, "材料 / 支出");
        const grid = createElement("div", { className: "row-grid" });

        grid.append(
          createField({
            label: "購買項目",
            control: createInput({
              id: `expenseItem_${index}`,
              type: "text",
              placeholder: "例如：電料、水泥、五金",
            }),
          }),
          createField({
            label: "金額",
            control: createInput({
              id: `expenseAmount_${index}`,
              type: "number",
              placeholder: "例如：675",
              min: "0",
              inputMode: "numeric",
            }),
          }),
        );

        card.appendChild(grid);
        dom.expensesContainer.appendChild(card);
      }

      function createEntryCard(type, index, titleText) {
        const card = createElement("div", {
          className: `entry-card ${type}-row`,
          dataset: { index },
        });
        const header = createElement("div", { className: "entry-header" });
        const title = createElement("h3", { className: "entry-title" });
        const badge = createElement("span", {
          className: "entry-badge",
          textContent: String(index),
        });
        const removeButton = createElement("button", {
          className: "remove-btn",
          type: "button",
          textContent: "×",
          title: type === "worker" ? "刪除此人員" : "刪除此材料 / 支出",
        });

        removeButton.addEventListener("click", () => removeEntryRow(type, card));

        title.append(badge, document.createTextNode(titleText));
        header.append(title, removeButton);
        card.appendChild(header);

        return card;
      }

      function createWorkerSelect(index) {
        const select = createElement("select", { id: `worker_name_${index}` });

        select.appendChild(
          createElement("option", {
            value: "",
            textContent: "請選擇人員",
          }),
        );

        state.employeeNames.forEach((name) => {
          select.appendChild(
            createElement("option", {
              value: name,
              textContent: name,
            }),
          );
        });

        return select;
      }

      function createField({ label, control, className = "field" }) {
        const wrapper = createElement("div", { className });
        const labelElement = createElement("label", { textContent: label });

        if (control.id) {
          labelElement.htmlFor = control.id;
        }

        wrapper.append(labelElement, control);
        return wrapper;
      }

      function createInput(attributes) {
        return createElement("input", attributes);
      }

      function createElement(tagName, options = {}) {
        const element = document.createElement(tagName);

        Object.entries(options).forEach(([key, value]) => {
          if (key === "dataset") {
            Object.entries(value).forEach(([dataKey, dataValue]) => {
              element.dataset[dataKey] = dataValue;
            });
            return;
          }

          if (key in element) {
            element[key] = value;
          } else {
            element.setAttribute(key, value);
          }
        });

        return element;
      }

      function removeEntryRow(type, rowElement) {
        const isWorker = type === "worker";
        const selector = isWorker ? ".worker-row" : ".expense-row";
        const container = isWorker ? dom.workersContainer : dom.expensesContainer;
        const minMessage = isWorker ? "至少要保留 1 個人員輸入列" : "至少要保留 1 個支出輸入列";

        if (container.querySelectorAll(selector).length <= 1) {
          setResult(minMessage, "error");
          return;
        }

        rowElement.remove();
        clearResult();
      }

      function submitForm() {
        if (state.isSubmitting) {
          setResult("資料送出中，請勿重複點擊", "loading");
          return;
        }

        try {
          validateApiUrl();

          const data = buildReportPayload();
          const errorMessage = validateReportPayload(data);

          if (errorMessage) {
            setResult(errorMessage, "error");
            return;
          }

          sendReport(data);
        } catch (error) {
          setResult(getErrorMessage(error), "error");
        }
      }

      function buildReportPayload() {
        return {
          submissionToken: generateSubmissionToken(),
          reporterName: getValue("reporterName"),
          reporterLineUserId: state.lineUserId,
          reporterIdToken: state.lineIdToken,
          workDate: getValue("workDate"),
          projectName: getValue("projectName"),
          site: getValue("site"),
          balanceText: getValue("balanceText"),
          remark: getValue("remark"),
          workers: collectRows(".worker-row", (index) => ({
            name: getValue(`worker_name_${index}`),
            hours: getValue(`worker_hours_${index}`),
            note: getValue(`worker_note_${index}`),
          })),
          expenses: collectRows(".expense-row", (index) => ({
            item: getValue(`expenseItem_${index}`),
            amount: getValue(`expenseAmount_${index}`),
          })),
        };
      }

      function collectRows(selector, mapRow) {
        return Array.from(document.querySelectorAll(selector)).map((row) => mapRow(row.dataset.index));
      }

      function validateReportPayload(data) {
        return (
          validateWorkDate(data.workDate) ||
          validateProjectName(data.projectName) ||
          validateWorkers(data.workers) ||
          validateExpenses(data.expenses)
        );
      }

      function validateWorkDate(workDate) {
        return workDate ? "" : "工作日期不可空白";
      }

      function validateProjectName(projectName) {
        return String(projectName || "").trim() ? "" : "工程名稱不可空白";
      }

      function validateWorkers(workers) {
        const usedNames = new Set();
        const validWorkers = workers.filter((worker) => String(worker.name || "").trim());

        if (validWorkers.length === 0) {
          return "至少需要 1 位有效人員";
        }

        for (let i = 0; i < workers.length; i += 1) {
          const worker = workers[i];
          const rowNo = i + 1;

          if (!worker.name) continue;

          if (worker.hours === "" || worker.hours === null || worker.hours === undefined) {
            return `人員第 ${rowNo} 筆已選姓名，但未填工作時數`;
          }

          const hoursNumber = Number(worker.hours);

          if (Number.isNaN(hoursNumber) || hoursNumber <= 0) {
            return `人員「${worker.name}」的工作時數必須大於 0`;
          }

          if (usedNames.has(worker.name)) {
            return `人員「${worker.name}」不可重複選擇`;
          }

          usedNames.add(worker.name);
        }

        return "";
      }

      function validateExpenses(expenses) {
        for (let i = 0; i < expenses.length; i += 1) {
          const expense = expenses[i];
          const rowNo = i + 1;
          const item = String(expense.item || "").trim();
          const amountRaw = expense.amount;
          const hasItem = item !== "";
          const hasAmount = amountRaw !== "" && amountRaw !== null && amountRaw !== undefined;

          if (hasItem && !hasAmount) {
            return `支出第 ${rowNo} 筆已填項目，但未填金額`;
          }

          if (!hasItem && hasAmount) {
            return `支出第 ${rowNo} 筆已填金額，但未填項目`;
          }

          if (!hasItem && !hasAmount) {
            continue;
          }

          const amountNumber = Number(amountRaw);

          if (Number.isNaN(amountNumber)) {
            return `支出第 ${rowNo} 筆金額格式錯誤`;
          }

          if (amountNumber < 0) {
            return `支出第 ${rowNo} 筆金額不可小於 0`;
          }
        }

        return "";
      }

      function sendReport(data) {
        setSubmittingState(true);
        setResult("正在送出資料...", "loading");

        fetch(CONFIG.appsScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify(data),
        })
          .then(() => {
            setResult("已送出資料。\n請到 Google Sheet 檢查是否新增資料。", "success");
            closeLiffWindowIfNeeded();
          })
          .catch((error) => {
            setResult("送出失敗：" + getErrorMessage(error), "error");
          })
          .finally(() => {
            setSubmittingState(false);
          });
      }

      function closeLiffWindowIfNeeded() {
        if (typeof liff === "undefined" || !liff.isInClient?.()) {
          return;
        }

        setTimeout(() => {
          liff.closeWindow();
        }, 1200);
      }

      function setSubmittingState(isSubmitting) {
        state.isSubmitting = isSubmitting;
        dom.submitBtn.disabled = isSubmitting;
        dom.submitBtn.classList.toggle("submit-disabled", isSubmitting);
        dom.submitBtn.textContent = isSubmitting ? "送出中，請稍候..." : "送出工程日報";
      }

      function setResult(message, type = "loading") {
        dom.result.textContent = message;
        dom.result.className = `result-box is-${type}`;
      }

      function clearResult() {
        dom.result.textContent = "";
        dom.result.className = "result-box";
      }

      function getValue(id) {
        return document.getElementById(id)?.value || "";
      }

      function generateSubmissionToken() {
        return `SUB_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
      }

      function getErrorMessage(error) {
        return error?.message || String(error);
      }
    </script>
  </body>
</html>
